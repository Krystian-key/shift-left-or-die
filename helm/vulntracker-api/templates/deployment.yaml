apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vulntracker-api.fullname" . }}
  labels:
    {{- include "vulntracker-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vulntracker-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "vulntracker-api.selectorLabels" . | nindent 8 }}
        app: {{ include "vulntracker-api.name" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vulntracker-api.serviceAccountName" . }}
      # Prevent automatic token mounting (defense against RCE → lateral movement)
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databaseUrlSecret }}
                  key: {{ .Values.secrets.databaseUrlField }}
            - name: NOTIFY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "vulntracker-api.fullname" . }}
                  key: NOTIFY_SERVICE_URL
            - name: JWT_PRIVATE_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jwtPrivateKeySecret }}
                  key: {{ .Values.secrets.jwtPrivateKeyField }}
            - name: JWT_PUBLIC_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jwtPrivateKeySecret }}
                  key: {{ .Values.secrets.jwtPublicKeyField }}
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.adminApiKeySecret }}
                  key: {{ .Values.secrets.adminApiKeyField }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

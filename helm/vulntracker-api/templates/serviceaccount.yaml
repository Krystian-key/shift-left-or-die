{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vulntracker-api.serviceAccountName" . }}
  labels:
    {{- include "vulntracker-api.labels" . | nindent 4 }}
# Disable automatic mounting of service account token
# Prevents RCE → steal token → lateral movement via Kubernetes API
automountServiceAccountToken: false
{{- end }}

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: "Load JWT secrets from GitHub Secrets"
        run: |
          echo "JWT_PRIVATE_KEY_B64=${{ secrets.JWT_PRIVATE_KEY_B64 }}" >> $GITHUB_ENV
          echo "JWT_PUBLIC_KEY_B64=${{ secrets.JWT_PUBLIC_KEY_B64 }}" >> $GITHUB_ENV

      - name: "Setup Python 3.11"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: "Install Python dependencies"
        run: pip install -r requirements.txt

      - name: "Run FastAPI unit tests"
        run: pytest tests/ -v

  test-notify:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: "Load JWT secrets from GitHub Secrets"
        run: |
          echo "JWT_PRIVATE_KEY_B64=${{ secrets.JWT_PRIVATE_KEY_B64 }}" >> $GITHUB_ENV
          echo "JWT_PUBLIC_KEY_B64=${{ secrets.JWT_PUBLIC_KEY_B64 }}" >> $GITHUB_ENV

      - name: "Setup Node.js 20"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"

      - name: "Install Node dependencies"
        run: npm ci
        working-directory: notify

      - name: "Run Node.js notification service tests"
        run: npm test
        working-directory: notify

  # TODO (candidates): Add the following security scanning jobs.
  # Tool selection is your decision — document your choices in findings.md.
  #
  # sast:
  #   Static Application Security Testing against app/ source code
  #   Upload JSON report as a build artifact named sast.<tool>.json
  #   Build should fail on critical findings
  #
  # sca:
  #   Dependency / Software Composition Analysis against requirements.txt
  #   Upload JSON report as a build artifact named sca.<tool>.json
  #   Build should fail on critical or high severity CVEs
  #
  # container-scan:
  #   Build the Docker image, then scan it for vulnerabilities and misconfigurations
  #   Upload JSON report as a build artifact named container.<tool>.json
  #
  # iac-scan:
  #   Scan the Helm chart or Terraform configuration for security misconfigurations
  #   Upload JSON report as a build artifact named iac.<tool>.json

  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: "[sast] Install Semgrep SAST scanner"
        run: pip install semgrep
      - name: "[sast] Run source code analysis (pretty-printed)"
        run: semgrep --json app/ 2>/dev/null | jq . > docs/TASK-2/sast.semgrep.json || true
      - name: "[sast] Upload scan report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sast-report
          path: docs/TASK-2/sast.semgrep.json

  sca:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@eab543b1deed5474cc86b36264cb9e001019d845  # v4.0.5
      - name: "[sbom] Download Syft SBOM generator (v0.68.1)"
        run: |
          SYFT_VERSION="0.68.1"
          SYFT_ARCHIVE="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o /tmp/syft-checksums.txt "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/checksums.txt"
          curl -sSfL -o /tmp/${SYFT_ARCHIVE} "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${SYFT_ARCHIVE}"
          (cd /tmp && grep ${SYFT_ARCHIVE} syft-checksums.txt | sha256sum -c)
          tar -xzf /tmp/${SYFT_ARCHIVE} -C /usr/local/bin syft
          rm /tmp/syft-checksums.txt /tmp/${SYFT_ARCHIVE}
      - name: "[sbom] Download Grype vulnerability scanner (v0.65.1)"
        run: |
          GRYPE_VERSION="0.65.1"
          GRYPE_ARCHIVE="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o /tmp/grype-checksums.txt "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/checksums.txt"
          curl -sSfL -o /tmp/${GRYPE_ARCHIVE} "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/${GRYPE_ARCHIVE}"
          (cd /tmp && grep ${GRYPE_ARCHIVE} grype-checksums.txt | sha256sum -c)
          tar -xzf /tmp/${GRYPE_ARCHIVE} -C /usr/local/bin grype
          rm /tmp/grype-checksums.txt /tmp/${GRYPE_ARCHIVE}
      - name: "[sbom] Generate software bill of materials (pretty-printed)"
        run: syft . -o cyclonedx-json 2>/dev/null | jq . > docs/TASK-2/sbom.cyclonedx.json
      - name: "[sca] Run dependency vulnerability scan (pretty-printed)"
        run: grype docs/TASK-2/sbom.cyclonedx.json -o json 2>/dev/null | jq . > docs/TASK-2/sca.grype.json || true
      - name: "[report] Generate summary with vulnerability counts"
        run: |
          SAST_COUNT=$(jq '.results | length' docs/TASK-2/sast.semgrep.json)
          SCA_TOTAL=$(jq '.matches | length' docs/TASK-2/sca.grype.json)
          SCA_CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity=="Critical")] | length' docs/TASK-2/sca.grype.json)
          SCA_HIGH=$(jq '[.matches[] | select(.vulnerability.severity=="High")] | length' docs/TASK-2/sca.grype.json)
          SCA_MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity=="Medium")] | length' docs/TASK-2/sca.grype.json)
          SCA_LOW=$(jq '[.matches[] | select(.vulnerability.severity=="Low")] | length' docs/TASK-2/sca.grype.json)
          cat > docs/TASK-2/SUMMARY.md << SUMMARY
          # Task 2 — Security Analysis Summary

          ## Scan Results Overview

          | Scan Type | Tool | Format | Status |
          |-----------|------|--------|--------|
          | SAST | Semgrep | sast.semgrep.json | ✅ Complete |
          | SBOM | Syft | sbom.cyclonedx.json | ✅ Complete |
          | SCA | Grype | sca.grype.json | ✅ Complete |
          | Container* | Trivy | container.trivy.json | ⏳ Task 4 |
          | IaC* | Checkov | iac.checkov.json | ⏳ Task 4 |

          ## Vulnerability Summary

          ### SAST (Semgrep)
          **Total Issues:** $SAST_COUNT

          ### SCA (Grype)
          **Total Vulnerabilities:** $SCA_TOTAL

          **By Severity:**
          - Critical: $SCA_CRITICAL
          - High: $SCA_HIGH
          - Medium: $SCA_MEDIUM
          - Low: $SCA_LOW

          ### SBOM (Syft)
          **Format:** CycloneDX
          **Status:** Complete dependency inventory

          ## File Access

          All reports are human-readable (pretty-printed JSON):
          - \`sast.semgrep.json\` — Source code security
          - \`sbom.cyclonedx.json\` — Dependency BOM
          - \`sca.grype.json\` — Known CVE vulnerabilities

          SUMMARY
      - name: "[sca] Upload vulnerability report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sca-report
          path: docs/TASK-2/sca.grype.json

